# Single-VPS deployment for Rayu accounts (website + backend + MySQL).
#
#   cd deploy
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
#
# Caddy terminates TLS and routes:
#   /api/*  -> backend:4000  (NestJS, global prefix /api)
#   /*      -> web:3000      (Next.js)
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    # Bind to localhost only so the DB is reachable for host-run migrations and
    # local tools, without exposing it publicly.
    ports:
      - '127.0.0.1:3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rayu

  backend:
    build:
      context: ../rayu-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      RAYU_JWT_SECRET: ${RAYU_JWT_SECRET}
      # Encrypts provider API keys entered in the admin dashboard before they are
      # written to MySQL. The gateway needs the identical value to decrypt them.
      RAYU_PROVIDER_SECRET: ${RAYU_PROVIDER_SECRET}
      RAYU_ACCESS_TTL: '3600'
      RAYU_REFRESH_TTL: '2592000'
      WEB_ORIGIN: ${PUBLIC_SITE_URL}
      # Hosted catalog (providers + models) is ADMIN-OWNED and is NOT seeded by
      # default: a fresh deployment starts with an empty catalog and the CLI shows
      # no hosted models until an admin adds them in the dashboard. Set
      # SEED_CATALOG=true only to populate the shipped defaults on a brand-new
      # database. Plans/settings always seed; config audits always run.
      SEED_CATALOG: ${SEED_CATALOG:-}
      # Bakong (phase 2 — unused in phase 1)
      BAKONG_MERCHANT_ID: ${BAKONG_MERCHANT_ID:-}
      BAKONG_PHONE_NUMBER: ${BAKONG_PHONE_NUMBER:-}
      BAKONG_DEVELOPER_TOKEN: ${BAKONG_DEVELOPER_TOKEN:-}
      BAKONG_API_URL: ${BAKONG_API_URL:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/api/health']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - rayu

  web:
    build:
      context: ../rayu-web
      args:
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
        # The browser calls the API at the public site under /api.
        NEXT_PUBLIC_RAYU_API_URL: ${PUBLIC_SITE_URL}/api
        # The credits dashboard reads live usage from the gateway under /gateway.
        NEXT_PUBLIC_RAYU_GATEWAY_URL: ${PUBLIC_SITE_URL}/gateway
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXT_PUBLIC_RAYU_API_URL: ${PUBLIC_SITE_URL}/api
      NEXT_PUBLIC_RAYU_GATEWAY_URL: ${PUBLIC_SITE_URL}/gateway
    networks:
      - rayu

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Ephemeral credit windows — no persistence needed (windows reset via TTL,
    # top-up balance re-syncs from MySQL).
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rayu

  gateway:
    build:
      context: ../rayu-gateway
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: '8080'
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: redis://redis:6379
      RAYU_JWT_SECRET: ${RAYU_JWT_SECRET}
      # Master key for the ENCRYPTED provider API keys in MySQL. Must be the SAME
      # value the backend uses (it seals, the gateway opens). The gateway refuses
      # to start if keys exist and this is missing/wrong.
      RAYU_PROVIDER_SECRET: ${RAYU_PROVIDER_SECRET}
      # Provider config AND keys are admin-managed rows in MySQL (dashboard →
      # Providers): base URL, wire format, auth scheme, enable switch, and one or
      # more API keys per provider (rotated by priority, with automatic failover).
      # Adding a provider or rotating a key needs NO redeploy — changes are picked
      # up within CONFIG_REFRESH_SECONDS.
      # Observability / model-fidelity (optional; safe defaults when unset).
      #   RAYU_ENFORCE_MODEL_FIDELITY=1  -> hard-reject a /v1/proxy request whose
      #     intended model family differs from the routed model (default: log only).
      #   RAYU_PROXY_BODY_READ_TIMEOUT=N -> seconds to wait for a request body
      #     before 408 (default 0 = Go server default; no SSE-breaking write cap).
      RAYU_ENFORCE_MODEL_FIDELITY: ${RAYU_ENFORCE_MODEL_FIDELITY:-}
      RAYU_PROXY_BODY_READ_TIMEOUT: ${RAYU_PROXY_BODY_READ_TIMEOUT:-}
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - rayu

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - backend
      - gateway
    ports:
      - '80:80'
      - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rayu

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  rayu:
    driver: bridge

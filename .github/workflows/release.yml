name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-x64
          - os: macos-latest
            target: darwin-arm64
          - os: windows-latest
            target: win-x64

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: '1.0.0'

    - name: Install dependencies
      working-directory: ./rayu
      run: bun install

    - name: Build binaries
      working-directory: ./rayu
      run: bun run build:binaries

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rayu-${{ matrix.target }}
        path: rayu/dist/binaries/*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Extract version
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## RAYU CLI ${{ steps.version.outputs.VERSION }}

          ### Installation

          **npm:**
          ```bash
          npm install -g @rayu-dev/rayu-cli@${{ steps.version.outputs.VERSION }}
          ```

          **Standalone binaries:**
          Download the binary for your platform below.

          ### What's Changed
          See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/v${{ steps.version.outputs.VERSION }}...HEAD
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: '1.0.0'

    - name: Install dependencies
      working-directory: ./rayu
      run: bun install

    - name: Build
      working-directory: ./rayu
      run: bun run build

    - name: Publish to npm
      working-directory: ./rayu
      run: npm publish --access public
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

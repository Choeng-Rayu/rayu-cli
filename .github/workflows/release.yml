name: Release

# MANUAL release pipeline for the CLI artifacts.
#
# Publishing to npm is done by hand, from rayu/:
#   bun run build && npm publish --access public
# This workflow never bumps the version, never commits, never tags, and never
# publishes to npm. It only builds and attaches the artifacts that the npm
# tarball does not carry: standalone native binaries and the Rayucode VSIXs.
#
# Recommended flow:
#   1. Bump rayu/package.json by hand and merge it to main.
#   2. cd rayu && bun run build && npm publish --access public
#   3. git tag -a v<version> -m "release: v<version>" && git push origin v<version>
#      → this workflow builds the artifacts and creates the GitHub Release.
#
# A tag whose version disagrees with rayu/package.json is rejected before
# anything is built.
#
# Quality gates are not duplicated here: .github/workflows/ci.yml runs the full
# finalize suite on every push to dev and every PR into main/dev.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to attach a GitHub Release to (e.g. v2.5.0). Leave empty to
          only build the artifacts. This workflow never creates a tag.
        type: string
        required: false
      publish_stores:
        description: 'Also publish the VSIXs to the VS Code Marketplace / Open VSX'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned: the compiled artifacts embed this exact runtime. Keep in step with
  # @types/bun.
  BUN_VERSION: 1.3.14

jobs:
  guard:
    name: Verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      create_release: ${{ steps.version.outputs.create_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the tag and package.json agree
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./rayu/package.json').version")"
          # Only an existing tag creates a GitHub Release. A tag is never
          # created here — `gh release create` would do that implicitly, which
          # is why a manual run without a tag only builds artifacts.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            CREATE_RELEASE=true
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            CREATE_RELEASE=true
            if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} does not exist on origin. Create it first: git tag -a ${TAG} -m 'release: ${TAG}' && git push origin ${TAG}"
              exit 1
            fi
          else
            echo "::notice::No tag given — building artifacts for v${VERSION} without a GitHub Release."
            TAG="v${VERSION}"
            CREATE_RELEASE=false
          fi
          if [ "$CREATE_RELEASE" = "true" ] && [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match rayu/package.json (v${VERSION}). Bump the version and merge it before tagging."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "create_release=${CREATE_RELEASE}" >> "$GITHUB_OUTPUT"
          if [ "$CREATE_RELEASE" = "true" ]; then
            echo "Releasing ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Building artifacts for v${VERSION} (no release)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Standalone native binaries (dist-native/ + manifest.json) — what install.sh
  # and the built-in updater download.
  native:
    name: Native binaries
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - run: bun run build-native
        working-directory: rayu
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: rayu/dist-native/*
          if-no-files-found: error

  vsix-linux:
    name: VSIX (linux/alpine/win)
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - name: Build the CLI bundle (the bundle tests compare against it)
        working-directory: rayu
        run: bun run build
      - name: Build VSIXs (universal, linux, alpine, win32)
        working-directory: rayu
        run: >-
          bun run build:vscode
          --target universal
          --target linux-x64 --target linux-arm64
          --target alpine-x64 --target alpine-arm64
          --target win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-linux
          path: rayu/dist/rayucode-*.vsix
          if-no-files-found: error

  vsix-macos:
    name: VSIX (darwin)
    needs: guard
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - name: Build darwin VSIXs (codesign --verify, ad-hoc sign when needed)
        working-directory: rayu
        run: bun run build:vscode --target darwin-x64 --target darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-darwin
          path: rayu/dist/rayucode-*-darwin-*.vsix
          if-no-files-found: error

  # Create the GitHub Release and attach native binaries + manifest + VSIXs.
  # Skipped when there is no tag to attach to; the artifacts are still uploaded
  # by the build jobs above.
  release:
    name: GitHub Release
    needs: [guard, native, vsix-linux, vsix-macos]
    if: ${{ needs.guard.outputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: dist-native
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          # Create as a draft, upload everything, then publish. Installers and
          # the CLI auto-updater resolve /releases/latest, which skips drafts,
          # so nobody can see this release before its binaries and
          # manifest.json are attached. The tag already exists (the guard
          # verified it), so no tag is created here.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --verify-tag \
              --title "Rayu CLI $TAG" \
              --generate-notes
          fi
          gh release upload "$TAG" --clobber \
            dist-native/rayu-cli-* \
            dist-native/manifest.json \
            vsix/*.vsix
          gh release edit "$TAG" --draft=false --latest

  # Opt-in: publish the VSIXs to the extension stores. Each step is skipped
  # when its secret is absent, so a missing store simply does nothing.
  publish-stores:
    name: Publish extension to stores
    needs: [guard, vsix-linux, vsix-macos]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_stores }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: rayu
        run: node_modules/.bin/vsce publish --skip-duplicate --packagePath ../vsix/*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: rayu
        run: |
          for vsix in ../vsix/*.vsix; do
            npx --yes ovsx publish "$vsix" --pat "$OVSX_PAT"
          done

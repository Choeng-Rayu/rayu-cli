name: Release

# Auto-release on merge/push to main. Runs the full finalize gates, derives the
# next semver version from conventional commits, prepends a CHANGELOG.md block
# (parsed at runtime by the in-TUI "What's new" — see rayu/src/utils/releaseNotes.ts),
# commits both back to main, tags vX.Y.Z, then publishes a GitHub Release with
# native binaries + npm + VSIX.
#
# Loop prevention / idempotency (4 layers):
#   1. the bump/changelog commit message carries "[skip ci]"
#   2. the prepare job is skipped when HEAD is already a `release:` commit
#   3. release-plan.ts no-ops if the target tag already exists on origin
#   4. npm and the GitHub Release are existence-checked before publishing
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan the release only — run finalize and print the planned version + changelog, but do not commit, tag, or publish.'
        type: boolean
        default: true
      force_release:
        description: 'Release even if no feat/fix/breaking commits are found since the last release.'
        type: boolean
        default: false

permissions:
  contents: write # required to commit the bump, push the tag, and create the release

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  # Pinned: the compiled artifacts embed this exact runtime. Keep in step with @types/bun.
  BUN_VERSION: 1.3.14

jobs:
  # Finalize + plan + commit bump + tag. Single source of truth for the version.
  prepare:
    name: Finalize, plan version & tag
    runs-on: ubuntu-latest
    # Skip when HEAD is itself the automated bump commit (layer 2 of loop prevention).
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'release:') }}
    outputs:
      version: ${{ steps.plan.outputs.version }}
      released: ${{ steps.plan.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Default GITHUB_TOKEN push works for unprotected main; set RELEASE_PAT
          # if main is branch-protected and blocks the bot push.
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/finalize

      - name: Plan release (dry-run)
        id: plan-dry
        run: |
          bun run .github/scripts/release-plan.ts \
            ${{ inputs.force_release && '--force' || '' }} \
            | tee /tmp/plan.txt
          {
            echo "version=$(grep -oE '^version=v[^ ]+' /tmp/plan.txt | head -n1 | cut -d= -f2)"
            echo "released=$(grep -oE '^released=(true|false)' /tmp/plan.txt | head -n1 | cut -d= -f2)"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo '```'
            cat /tmp/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit version bump + changelog, tag, and push
        id: plan
        if: ${{ steps.plan-dry.outputs.released == 'true' && (github.event_name == 'push' || inputs.dry_run == false) }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.plan-dry.outputs.version }}"
          bun run .github/scripts/release-plan.ts --apply --force 2>/dev/null \
            | grep -E '^(version|released)=' | tee /tmp/apply.txt
          {
            echo "version=$(grep -oE '^version=v[^ ]+' /tmp/apply.txt | cut -d= -f2)"
            echo "released=$(grep -oE '^released=(true|false)' /tmp/apply.txt | cut -d= -f2)"
          } >> "$GITHUB_OUTPUT"
          if [ "$(grep -oE '^released=(true|false)' /tmp/apply.txt | cut -d= -f2)" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add rayu/package.json rayu/CHANGELOG.md
            git commit -m "release: ${VERSION} [skip ci]"
            git tag -a "${VERSION}" -m "release: ${VERSION}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            git push origin "refs/tags/${VERSION}"
          fi

  # Standalone native binaries (dist-native/ + manifest.json) — what install.sh
  # and the built-in updater download. Runs in rayu/ because build-native reads
  # package.json from the CWD.
  native:
    name: Native binaries
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - run: bun run build-native
        working-directory: rayu
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: rayu/dist-native/*
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - run: bun run build
        working-directory: rayu
      - name: Publish (idempotent)
        working-directory: rayu
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # Skip if this version is already on the registry (layer 4 of idempotency).
          if npm view "@rayu-dev/rayu-cli@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@rayu-dev/rayu-cli@${VERSION} already published; skipping"
          else
            npm publish --access public
          fi

  # VSIX (universal + linux/alpine/win). Mirrors the proven build-linux job in
  # rayucode-vsix.yml — that workflow stays for manual, opt-in store publishing.
  vsix-linux:
    name: VSIX (linux/alpine/win)
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - name: Build the CLI bundle (the bundle tests compare against it)
        working-directory: rayu
        run: bun run build
      - name: Build VSIXs (universal, linux, alpine, win32)
        working-directory: rayu
        run: >-
          bun run build:vscode
          --target universal
          --target linux-x64 --target linux-arm64
          --target alpine-x64 --target alpine-arm64
          --target win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-linux
          path: rayu/dist/rayucode-*.vsix
          if-no-files-found: error

  vsix-macos:
    name: VSIX (darwin)
    needs: prepare
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - name: Build darwin VSIXs (codesign --verify, ad-hoc sign when needed)
        working-directory: rayu
        run: bun run build:vscode --target darwin-x64 --target darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-darwin
          path: rayu/dist/rayucode-*-darwin-*.vsix
          if-no-files-found: error

  # Create the GitHub Release and attach native binaries + manifest + VSIXs.
  release:
    name: GitHub Release
    needs: [prepare, native, npm, vsix-linux, vsix-macos]
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: native
          path: dist-native
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # Create as a draft, upload everything, then publish. Installers and
          # the CLI auto-updater resolve /releases/latest, which skips drafts,
          # so nobody can see this release before its binaries and
          # manifest.json are attached.
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --draft \
              --title "Rayu CLI ${VERSION}" \
              --generate-notes
          fi
          gh release upload "$VERSION" --clobber \
            dist-native/rayu-cli-* \
            dist-native/manifest.json \
            vsix/*.vsix
          gh release edit "$VERSION" --draft=false --latest

  # Publish the extension to the VS Code Marketplace (and Open VSX if configured).
  # Each store step is skipped when its secret is absent, so this never fails the
  # release just because a store is not set up. --skip-duplicate makes re-runs safe.
  publish-stores:
    name: Publish extension to stores
    needs: [prepare, vsix-linux, vsix-macos]
    if: ${{ needs.prepare.outputs.released == 'true' }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: rayu
      - uses: actions/download-artifact@v4
        with:
          pattern: vsix-*
          path: vsix
          merge-multiple: true
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: rayu
        run: node_modules/.bin/vsce publish --skip-duplicate --packagePath ../vsix/*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: rayu
        run: |
          for vsix in ../vsix/*.vsix; do
            npx --yes ovsx publish "$vsix" --pat "$OVSX_PAT"
          done

name: CI

# Finalize checks only — no release. Pushes to dev and PRs targeting main/dev
# run the shared finalize gates. Releases happen exclusively on main via
# release.yml.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  finalize:
    name: Finalize (rayu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/finalize

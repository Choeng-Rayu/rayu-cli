[workspace]
members = ["crates/core", "crates/gateway", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Dependencies are pinned at the workspace level so every crate agrees on one
# version of tokio/serde/etc. All TLS goes through rustls -- no OpenSSL link, so
# the release binary cross-compiles and stays small.
[workspace.dependencies]
axum = { version = "0.8", features = ["json", "tokio", "http1", "http2"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
pin-project-lite = "0.2"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
    "chrono",
    "json",
    "macros",
] }
redis = { version = "0.27", default-features = false, features = [
    "tokio-comp",
    "script",
    "keep-alive",
    "connection-manager",
] }

arc-swap = "1"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
dashmap = "6"

jsonwebtoken = { version = "9", default-features = false }
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "http2",
] }

serde = { version = "1", features = ["derive"] }
# preserve_order keeps relayed / re-marshalled JSON in the caller's field order,
# which the byte-for-byte passthrough contract depends on.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "serde",
    "std",
] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

bytes = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
regex = "1"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
url = "2"
percent-encoding = "2"

# dev
wiremock = "0.6"
insta = { version = "1", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

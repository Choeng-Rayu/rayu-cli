[package]
name = "portable-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `rayu/src/core/portable/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "3"
napi-derive = "3"
sha2 = "0.10"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
